plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

android {
    namespace 'org.y20k.transistor'
    compileSdk 37

    defaultConfig {
        applicationId "org.y20k.transistor"
        minSdkVersion 25
        targetSdkVersion 37
        versionCode 115
        versionName "4.3.8"
        resourceConfigurations += ['en', 'ar', 'ast', 'bg', 'ca', 'ckb', 'cs', 'cy', 'de', 'el', 'eo', 'es', 'et', 'eu', 'fi', 'fr', 'fy', 'ga', 'gl', 'hi', 'hr', 'hu', 'ia', 'id', 'it', 'iw', 'ja', 'ko', 'nb-rNO', 'nl', 'pl', 'pt', 'pt-rBR', 'ro', 'ru', 'sk', 'sl', 'sr', 'ta', 'tr', 'uk', 'zh-rCN']
        // languages listed here, should also be listed in /app/src/main/res/xml/locales_config.xml
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true // required - do not remove: since AGP 8 BuildConfig is opt-in, Keys.USER_AGENT and SettingsFragment need BuildConfig.VERSION_NAME
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            // Comment out the below lines if you do not need to test resource shrinking
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile(
//                    'proguard-android-optimize.txt'),
//                    'proguard-rules.pro'
        }

    }


    lint {
        disable 'MissingTranslation'
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

dependencies {
    //implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"

    def coroutinesVersion = "1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    implementation "com.google.android.material:material:1.14.0"

    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.palette:palette-ktx:1.0.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation "androidx.media:media:1.8.0"

    def mediaVersion = "1.10.1"
    implementation "androidx.media3:media3-exoplayer:$mediaVersion"
    implementation "androidx.media3:media3-exoplayer-hls:$mediaVersion"
    implementation "androidx.media3:media3-session:$mediaVersion"

    def navigationVersion = "2.9.8"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$navigationVersion"

    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    implementation "com.google.code.gson:gson:2.14.0"
    implementation 'com.android.volley:volley:1.2.1'

    implementation "com.github.bumptech.glide:glide:5.0.9"

}
