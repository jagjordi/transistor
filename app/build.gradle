plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

android {
    namespace 'org.y20k.transistor'
    compileSdk 37

    defaultConfig {
        applicationId "org.y20k.transistor"
        minSdkVersion 25
        targetSdkVersion 37
        versionCode 115
        versionName "4.3.8"
        resourceConfigurations += ['en', 'ar', 'ast', 'bg', 'ca', 'ckb', 'cs', 'cy', 'de', 'el', 'eo', 'es', 'et', 'eu', 'fi', 'fr', 'fy', 'ga', 'gl', 'hi', 'hr', 'hu', 'ia', 'id', 'it', 'iw', 'ja', 'ko', 'nb-rNO', 'nl', 'pl', 'pt', 'pt-rBR', 'ro', 'ru', 'sk', 'sl', 'sr', 'ta', 'tr', 'uk', 'zh-rCN']
        // languages listed here, should also be listed in /app/src/main/res/xml/locales_config.xml
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true // required - do not remove: since AGP 8 BuildConfig is opt-in, Keys.USER_AGENT and SettingsFragment need BuildConfig.VERSION_NAME
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            // Comment out the below lines if you do not need to test resource shrinking
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile(
//                    'proguard-android-optimize.txt'),
//                    'proguard-rules.pro'
        }

    }


    lint {
        disable 'MissingTranslation'
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

dependencies {
    implementation libs.kotlin.stdlib.jdk8

    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    implementation libs.material

    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.palette.ktx
    implementation libs.androidx.preference
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.media

    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.media3.session

    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    implementation libs.androidx.work.runtime.ktx

    implementation libs.gson
    implementation libs.volley

    implementation libs.glide

}
